name: Deterministic Verification

# Deterministic verification (validate + test verdict modes). Mirrors
# agentic-verification.yml, which carries the audit + review verdict modes.
# The fast source checks group into one validation job (the validate-all
# pipeline); circular, build, and packaged checks are separate jobs that run in
# parallel, fanning out from a single shared build artifact. The test and status
# job waits for Validate and the build, so the suite and the status projection
# run only once Validate passes.
#
# Runner selection goes through the org-level `RUNNER_X2` / `RUNNER_X4`
# variables so a provider outage is a variable flip, not a pull request. Unset
# both to fall back to GitHub-hosted `ubuntu-latest`; note that on a public
# repo `ubuntu-latest` is itself 4-core, so the fallback silently upgrades the
# X2 jobs rather than starving them.

on:
  push:
    branches: [main]
    paths-ignore:
      - CLAUDE.md
      - AGENTS.md
      - README.md
      - LICENSE
      - docs/**
  pull_request:
    branches: [main]
  # Callable as a release gate by publish.yml so the publish runs the full
  # deterministic suite exactly once on the tagged commit and consumes its
  # verified build artifact.
  workflow_call:

# Deny all permissions by default — grant per-job
permissions: {}

jobs:
  validation:
    name: Validation
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Runs the source validation pipeline — lint, typecheck, format, markdown,
      # literal-reuse, and informational knip — in registry order.
      - run: pnpm run validate

  circular:
    name: Circular dependencies
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run circular

  build:
    name: Build packaged CLI
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  test-and-status:
    name: Test + status projection
    needs: [validation, build]
    runs-on: ${{ vars.RUNNER_X4 || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      # The pull request head commit, not the merge commit, with full history,
      # so pin commits and claim history are comparable.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The L2 tests shell out to node bin/spx.js -> dist/cli.js, so the
      # verified build from the build job stands in for a local rebuild.
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Provisions the pytest toolchain so the Python runner's real-tool test
      # runs against real pytest, before the suite step.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install managed Python
        run: uv python install 3.13
      - name: Provision pytest
        run: |
          uv venv --python 3.13
          uv pip install --only-binary :all: --require-hashes -r .github/pytest-requirements.txt
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The agent-search locator shells out to ripgrep, which the hosted Ubuntu
      # image does not carry; the L2 locator scenario runs against the real binary.
      - name: Provision ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      # One suite run: the journaled verification run covers the configured
      # unscoped test scope and seals a run journal under .spx/ recording each
      # module's verdict and the paths it read. The status step then reuses that
      # sealed journal to regenerate the status projection in memory, without
      # writing a file or re-running any test, and fails when a node's state or an
      # entry's verdict or read set differs from the committed claim.
      - name: Test (journaled verification run)
        run: pnpm exec tsx src/cli.ts verification test run
      - name: Check committed status projection
        run: pnpm exec tsx src/cli.ts spec status --update --check

  validate-published:
    name: Validation (packaged CLI)
    needs: build
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: pnpm run validate:published

  circular-published:
    name: Circular dependencies (packaged CLI)
    needs: build
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: pnpm run circular:published

  package:
    name: Package contents
    needs: build
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npm pack --dry-run
