name: Methodology fetch

# Refreshes the shipped methodology trees under methodology/{MAJOR.MINOR}/
# from outcomeeng/plugins. The plugins repository dispatches this workflow on
# every push to its default branch that changes dist/; a manual dispatch names
# a revision and, while no plugin manifest declares the line it provides, the
# line. The refreshed tree reaches main through an ordinary pull request so the
# normal gate runs on it — which is why the push and the pull request use a
# repository secret token rather than GITHUB_TOKEN, whose pull requests
# trigger no workflows.

on:
  repository_dispatch:
    types: [plugins-published]
  workflow_dispatch:
    inputs:
      revision:
        description: "outcomeeng/plugins revision to read: a branch, tag, or commit"
        required: false
        default: main
      line:
        description: "Methodology line (MAJOR.MINOR) when no plugin manifest declares the line it provides"
        required: false
        default: ""

# Deny all permissions by default — grant per-job
permissions: {}

concurrency:
  group: methodology-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch methodology trees
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      REVISION: ${{ github.event.client_payload.revision || inputs.revision || 'main' }}
      LINE: ${{ github.event.client_payload.line || inputs.line || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.METHODOLOGY_FETCH_TOKEN }}
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch the trees at the named revision
        run: |
          set -euo pipefail
          if [ -n "$LINE" ]; then
            pnpm run methodology:fetch --revision "$REVISION" --line "$LINE"
          else
            pnpm run methodology:fetch --revision "$REVISION"
          fi

      - name: Open a pull request when the shipped trees changed
        env:
          GH_TOKEN: ${{ secrets.METHODOLOGY_FETCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- methodology)" ]; then
            echo "Shipped methodology trees are current for ${REVISION}."
            exit 0
          fi
          revision_sha="$(node --input-type=module --eval 'import { readdirSync, existsSync, readFileSync } from "node:fs"; const line = readdirSync("methodology").find((name) => existsSync(`methodology/${name}/source.json`)); process.stdout.write(JSON.parse(readFileSync(`methodology/${line}/source.json`, "utf8")).revision);')"
          branch="work/methodology-fetch-${revision_sha:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A -- methodology
          git commit -m "build(methodology): fetch outcomeeng/plugins@${revision_sha:0:12}"
          git push --force-with-lease origin "$branch"

          existing_pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing pull request #${existing_pr}."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$branch" \
            --title "build(methodology): fetch outcomeeng/plugins@${revision_sha:0:12}" \
            --body "Refreshes the shipped methodology trees under methodology/ from outcomeeng/plugins at ${revision_sha}."
