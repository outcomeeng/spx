name: Dependency Security

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - CLAUDE.md
      - AGENTS.md
      - README.md
      - LICENSE
      - docs/**

# Deny all permissions by default — grant per-job
permissions: {}

jobs:
  dependency-review:
    name: Dependency Security Check
    runs-on: ${{ vars.RUNNER_X2 || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
