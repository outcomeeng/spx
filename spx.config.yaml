methodology:
  source: outcomeeng/methodology
  version: 4.0.0
  migratingFrom: 3.1.0

validation:
  literal:
    values:
      include:
        - --idempotency-key <key>
        - --payload <payload-source>
        - --exclude=
        - "*.test.ts"
        - "*.test.tsx"
        - "Literal: No problems of type "
        - append-finding
        - append-scope
        - event
        - finding
        - journal
        - node_modules
        - scope
        - skippedTests
        - unmatched
        - unresolvedChangedSourceFiles
        - unresolvedTargets
        - verification
        - verify
